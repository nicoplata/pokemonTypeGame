<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego de combate por turnos con Pokémon y tabla de tipos, usando datos de PokéAPI.">
    <title>Pokémon Type Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div id="page">
        <header>
            <img src="./img/pokemonLogo.png" alt="Logo de Pokémon">
            <h1>POKéDEX</h1>
        </header>

        <nav aria-label="Pokédex">
            <div id="pokedexList">
                <h2 class="listTitle">POKéMON</h2>
                <p class="listHint" id="listHint">Tocá uno para ver sus datos</p>
                <ul>
                    <li><button type="button" class="pokemonLink" data-pokemon="1">BULBASAUR</button></li>
                    <li><button type="button" class="pokemonLink" data-pokemon="4">CHARMANDER</button></li>
                    <li><button type="button" class="pokemonLink" data-pokemon="7">SQUIRTLE</button></li>
                    <li><button type="button" class="pokemonLink" data-pokemon="152">CHIKORITA</button></li>
                    <li><button type="button" class="pokemonLink" data-pokemon="155">CYNDAQUIL</button></li>
                    <li><button type="button" class="pokemonLink" data-pokemon="158">TOTODILE</button></li>
                </ul>
            </div>
        </nav>

        <main>
            <div class="column">
                <section class="card" id="trainerCard" aria-label="Datos del entrenador">
                    <h2 class="cardTitle">ENTRENADOR</h2>
                    <dl class="dataList">
                        <div><dt>NOMBRE</dt><dd id="trainerName">-</dd></div>
                        <div><dt>POKéMON</dt><dd id="trainerPokemon">-</dd></div>
                        <div><dt>RÉCORD</dt><dd id="trainerRecord">0V - 0D</dd></div>
                    </dl>
                </section>

                <section class="card" id="actionPanel" aria-label="Panel de acciones">
                    <div id="chat">
                        <div class="chatArea" id="oakChat">
                            <img src="./img/profesorOak.png" alt="Profesor Oak">
                            <div class="bubble">
                                <p class="speaker">PROFESOR</p>
                                <p id="chatOak"></p>
                                <p id="anuncio" class="srOnly" aria-live="polite"></p>
                            </div>
                        </div>
                        <div class="chatArea" id="trainerChat">
                            <div class="bubble">
                                <p class="speaker">ENTRENADOR</p>
                                <div id="chatTrainer"></div>
                            </div>
                            <img src="./img/ashKetchum.png" alt="Entrenador">
                        </div>
                    </div>
                    <div id="answers"></div>
                </section>
            </div>

            <div class="column">
                <section class="card pokemonCard" id="cardJugador" aria-label="Tu Pokémon">
                    <h2 class="cardTitle" data-campo="nombre">-</h2>
                    <div class="healthBar" aria-hidden="true"><div class="healthFill" data-campo="barra"></div></div>
                    <div class="infoContainer">
                        <div class="imageCard"><img data-campo="imagen" src="" alt="" hidden></div>
                        <dl class="dataList">
                            <div><dt>NIVEL</dt><dd data-campo="nivel">-</dd></div>
                            <div><dt>SALUD</dt><dd data-campo="salud">-</dd></div>
                            <div><dt>TIPO</dt><dd data-campo="tipo">-</dd></div>
                            <div><dt title="Físico / Especial">ATAQUE</dt><dd data-campo="ataque">-</dd></div>
                            <div><dt title="Física / Especial">DEFENSA</dt><dd data-campo="defensa">-</dd></div>
                            <div><dt>VELOC.</dt><dd data-campo="velocidad">-</dd></div>
                        </dl>
                    </div>
                </section>

                <section class="card pokemonCard" id="cardRival" aria-label="Pokémon rival">
                    <h2 class="cardTitle" data-campo="nombre">-</h2>
                    <div class="healthBar" aria-hidden="true"><div class="healthFill" data-campo="barra"></div></div>
                    <div class="infoContainer">
                        <div class="imageCard"><img data-campo="imagen" src="" alt="" hidden></div>
                        <dl class="dataList">
                            <div><dt>NIVEL</dt><dd data-campo="nivel">-</dd></div>
                            <div><dt>SALUD</dt><dd data-campo="salud">-</dd></div>
                            <div><dt>TIPO</dt><dd data-campo="tipo">-</dd></div>
                            <div><dt title="Físico / Especial">ATAQUE</dt><dd data-campo="ataque">-</dd></div>
                            <div><dt title="Física / Especial">DEFENSA</dt><dd data-campo="defensa">-</dd></div>
                            <div><dt>VELOC.</dt><dd data-campo="velocidad">-</dd></div>
                        </dl>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <dialog id="modal" aria-labelledby="modalTitle">
        <p id="modalIcon" aria-hidden="true"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <div id="modalButtons"></div>
    </dialog>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
